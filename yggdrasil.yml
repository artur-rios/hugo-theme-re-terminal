# What Jenkins checks for this repository, read by the pipeline of the yggdrasil installation that runs it
# (yggdrasil's docs/catalog.md, "Repository pipeline file", has every field). It is data, never code: images
# (pinned by version and digest, which Renovate keeps up to date), commands, globs and the names of Jenkins
# credentials. The commands are the scripts under ci/, which run from the repository's root, so you can run them on
# your machine too. Nothing is deployed or released from this fork: the checks run on every pull request and push.
#
# Check it where the catalog is, in the yggdrasil checkout:
#   python3 scripts/pipeline_config.py describe hugo-theme-re-terminal <this repository's checkout>

checks:
  lint:                                  # the theme's own ESLint and stylelint configs, on its JS and SCSS
    image: node:24.22.2-bookworm@sha256:8fa96264f302f58bbb13aa7339c541547b56975766ce956c875da149452a3e40
    run: sh ci/lint.sh

  build:                                 # demoSite built with the theme (Hugo extended: the theme's SCSS)
    image: hugomods/hugo:debian-node-lts-0.165.0@sha256:eef6a12572c8cf3fea72fb034606f3e6a0821368682139378608eabc94e67c87
    run: sh ci/build.sh
